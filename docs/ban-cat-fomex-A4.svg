<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" font-family="Arial, Helvetica, sans-serif">
  <!-- Fomex 5 mm node box, 1:1 scale. Inner 110 x 80 x 30 mm, outer 120 x 90 x 40 mm.
       Internal coords: X from wall A, Y from the Pico-side long wall. Base/lid drawn from above: svg = 5 + internal. -->
  <style>
    .cut { fill: none; stroke: #000; stroke-width: .35; }
    .hole { fill: #d9d9d9; stroke: #000; stroke-width: .35; }
    .mark { fill: none; stroke: #777; stroke-width: .25; stroke-dasharray: 1.6 1; }
    .lip { fill: none; stroke: #2a6fd6; stroke-width: .3; stroke-dasharray: 2 1; }
    .t { font-size: 3px; fill: #000; }
    .s { font-size: 2.3px; fill: #444; }
    .h { font-size: 3.6px; font-weight: bold; fill: #000; }
    .b { font-size: 2.3px; fill: #2a6fd6; }
  </style>
  <rect width="297" height="210" fill="#fff"/>
  <text x="8" y="7" class="h">Bản cắt hộp node · fomex 5 mm · tỉ lệ 1:1 · in A4 ngang, scale 100%</text>

  <!-- BASE -->
  <g transform="translate(8 12)">
    <rect class="cut" width="120" height="90"/>
    <rect class="mark" x="5" y="5" width="110" height="80"/>
    <rect class="mark" x="6" y="7" width="70" height="50"/>
    <text x="40" y="54" class="s">mạch đục lỗ 50×70</text>
    <rect class="mark" x="6" y="8.5" width="51" height="21"/>
    <text x="16" y="20" class="s">Pico 2 W (USB → tường A)</text>
    <rect x="52" y="8.5" width="5" height="21" fill="#eee" stroke="none"/>
    <text x="54.5" y="33" class="s" text-anchor="middle">anten</text>
    <g class="mark">
      <circle cx="9" cy="10" r="2.8"/><circle cx="73" cy="10" r="2.8"/>
      <circle cx="9" cy="54" r="2.8"/><circle cx="73" cy="54" r="2.8"/>
    </g>
    <text x="78" y="11" class="s">○ trụ M3 (dán keo)</text>
    <rect class="mark" x="6" y="64" width="28" height="17"/>
    <text x="20" y="73.5" class="s" text-anchor="middle">đệm TP4056</text>
    <rect class="mark" x="35" y="62" width="78" height="21"/>
    <text x="74" y="73.5" class="s" text-anchor="middle">đế pin 18650</text>
    <text x="1.2" y="47" class="t" transform="rotate(-90 1.2 47)" text-anchor="middle">◄ tường A</text>
    <text x="60" y="-1.5" class="t" text-anchor="middle">ĐÁY 120 × 90 (nhìn từ trên)</text>
  </g>

  <!-- LID -->
  <g transform="translate(140 12)">
    <rect class="cut" width="120" height="90"/>
    <rect class="mark" x="5" y="5" width="110" height="80"/>
    <rect class="lip" x="10" y="5.5" width="100" height="8"/>
    <rect class="lip" x="10" y="76.5" width="100" height="8"/>
    <rect class="lip" x="5.5" y="15" width="8" height="60"/>
    <rect class="lip" x="106.5" y="15" width="8" height="60"/>
    <text x="60" y="11" class="b" text-anchor="middle">gờ định vị dán mặt dưới</text>
    <circle class="hole" cx="27" cy="45" r="2.5"/><text x="31" y="46" class="s">LED đỏ Ø5</text>
    <circle class="hole" cx="27" cy="53" r="2.5"/><text x="31" y="54" class="s">LED xanh Ø5</text>
    <circle class="hole" cx="45" cy="47" r="2.5"/><text x="49" y="48" class="s">quang trở Ø5</text>
    <circle class="hole" cx="18" cy="16" r="2"/><text x="22" y="17" class="s">BOOTSEL Ø4 *</text>
    <circle class="hole" cx="17" cy="37" r="2"/><text x="21" y="38" class="s">Reset Ø4</text>
    <circle class="hole" cx="20" cy="68" r="1.5"/><circle class="hole" cx="20" cy="73" r="1.5"/>
    <text x="23" y="71.5" class="s">đèn sạc TP4056 Ø3 *</text>
    <text x="1.2" y="47" class="t" transform="rotate(-90 1.2 47)" text-anchor="middle">◄ tường A</text>
    <text x="60" y="-1.5" class="t" text-anchor="middle">NẮP 120 × 90 (nhìn từ trên)</text>
  </g>

  <!-- LONG WALLS -->
  <g transform="translate(8 118)">
    <rect class="cut" width="120" height="30"/>
    <text x="60" y="16.5" class="t" text-anchor="middle">THÀNH DÀI 1 · 120 × 30</text>
  </g>
  <g transform="translate(8 156)">
    <rect class="cut" width="120" height="30"/>
    <text x="60" y="16.5" class="t" text-anchor="middle">THÀNH DÀI 2 · 120 × 30</text>
  </g>

  <!-- WALL A (outside view, bottom edge sits on the base, Pico side on the left) -->
  <g transform="translate(140 118)">
    <rect class="cut" width="80" height="30"/>
    <rect class="hole" x="8" y="8.5" width="12" height="8"/>
    <text x="14" y="21" class="s" text-anchor="middle">USB Pico</text>
    <text x="14" y="23.6" class="s" text-anchor="middle">12×8</text>
    <rect class="hole" x="33.5" y="10.5" width="13" height="9"/>
    <text x="40" y="23" class="s" text-anchor="middle">công tắc 13×9 *</text>
    <rect class="hole" x="61" y="16.5" width="13" height="9"/>
    <text x="67.5" y="14.5" class="s" text-anchor="middle">USB sạc 13×9</text>
    <text x="40" y="4" class="s" text-anchor="middle">TƯỜNG A · 80 × 30 · nhìn từ ngoài vào</text>
    <text x="40" y="29" class="s" text-anchor="middle">▼ mép dưới (đứng trên đáy)</text>
  </g>

  <!-- WALL B -->
  <g transform="translate(140 156)">
    <rect class="cut" width="80" height="30"/>
    <text x="40" y="16.5" class="t" text-anchor="middle">TƯỜNG B · 80 × 30</text>
  </g>

  <!-- small parts -->
  <g transform="translate(230 118)">
    <rect class="cut" width="28" height="17"/>
    <text x="14" y="10" class="s" text-anchor="middle">đệm 28×17</text>
  </g>
  <g transform="translate(230 142)">
    <rect class="cut" width="60" height="8"/>
    <text x="30" y="5.3" class="s" text-anchor="middle">gờ ngắn 60×8</text>
  </g>
  <g transform="translate(230 154)">
    <rect class="cut" width="60" height="8"/>
    <text x="30" y="5.3" class="s" text-anchor="middle">gờ ngắn 60×8</text>
  </g>
  <g transform="translate(8 192)">
    <rect class="cut" width="100" height="8"/>
    <text x="50" y="5.3" class="s" text-anchor="middle">gờ dài 100×8</text>
  </g>
  <g transform="translate(116 192)">
    <rect class="cut" width="100" height="8"/>
    <text x="50" y="5.3" class="s" text-anchor="middle">gờ dài 100×8</text>
  </g>

  <!-- scale check + legend -->
  <g transform="translate(230 172)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#000" stroke-width=".5"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#000" stroke-width=".5"/>
    <line x1="50" y1="-2" x2="50" y2="2" stroke="#000" stroke-width=".5"/>
    <text x="25" y="-1.5" class="s" text-anchor="middle">thước kiểm tra: phải đúng 50 mm</text>
    <text x="0" y="7" class="s">— nét liền đen: cắt</text>
    <text x="0" y="10.5" class="s">▭ ô xám: khoét lỗ</text>
    <text x="0" y="14" class="s">- - nét đứt xám: vị trí dán, không cắt</text>
    <text x="0" y="17.5" class="s">* đo lại linh kiện thật trước khi khoét</text>
  </g>
</svg>
